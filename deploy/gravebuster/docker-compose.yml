name: octo

services:
  octo-web:
    build:
      context: ../..
      dockerfile: deploy/gravebuster/Dockerfile.web
    image: octo-web:${IMAGE_TAG:-latest}
    container_name: octo-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-8091}:80"
    depends_on:
      octo-api:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - octo-internal

  octo-api:
    build:
      context: ../..
      dockerfile: deploy/gravebuster/Dockerfile.api
    image: octo-api:${IMAGE_TAG:-latest}
    container_name: octo-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORT=3001
    # Only written when OCTO_STORAGE_BACKEND=local (the default backend is R2, which
    # stores nothing here). On a local-backend host this volume is what keeps
    # uploaded file bytes across a container recreate -- without it the local
    # backend's /tmp/octo-storage is ephemeral and every deploy loses the files.
    volumes:
      - octo-file-data:/tmp/octo-storage
    depends_on:
      octo-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e 'fetch(\"http://127.0.0.1:3001/health\").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - octo-internal

  # FalkorDB: the per-workspace graph engine (issue #12). One graph per workspace,
  # named server-side from the authenticated workspace UUID inside Octo's mediation
  # path. It joins the internal network only -- no published port -- so the sole way
  # to reach a graph is through Octo's API/MCP, which holds the password. requirepass
  # is an access gate, not a tenant boundary: anyone holding it can query every
  # graph, so nothing outside octo_internal may have it.
  #
  # Pinned to an explicit upstream tag, never ${IMAGE_TAG}, so rollback.sh keeps
  # addressing the same engine build. No depends_on from octo-api: the graph is
  # optional and must never gate API startup. A graph is a rebuildable projection of
  # canonical Postgres, so AOF is off and there is no data volume -- durability is
  # Postgres, not this container.
  octo-graph:
    image: falkordb/falkordb-server:6.0.1
    container_name: octo-graph
    restart: unless-stopped
    environment:
      # --maxmemory sits below the container cap so the engine refuses writes and
      # degrades, instead of growing into an OOM kill. It is in-memory: the cap
      # protects the host.
      REDIS_ARGS: "--requirepass ${OCTO_GRAPH_PASSWORD:-graphpassword} --maxmemory ${OCTO_GRAPH_MAXMEMORY:-768mb}"
    mem_limit: ${OCTO_GRAPH_MEMORY_LIMIT:-1g}
    networks:
      - octo-internal

  octo-db:
    image: pgvector/pgvector:pg16
    container_name: octo-db
    restart: unless-stopped
    # A workspace's provisioned database is meant to be connected to by an ordinary
    # Postgres client, but publishing this port would expose the whole cluster --
    # the control plane included -- to every interface, because Docker's port rules
    # sit ahead of the host firewall. So it is published on loopback and Tailscale
    # forwards it to the tailnet only (`tailscale serve --bg --tcp`, documented in
    # .env.example). Set OCTO_DB_PUBLISH_ADDR to a host address to skip the
    # forwarder and publish directly instead.
    ports:
      - "${OCTO_DB_PUBLISH_ADDR:-127.0.0.1}:${OCTO_DB_PUBLIC_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
    volumes:
      - octo-db-data:/var/lib/postgresql/data
      - ./initdb/00-supabase-auth-scaffold.sql:/docker-entrypoint-initdb.d/00-supabase-auth-scaffold.sql:ro
      - ./initdb/01-apply-migrations.sh:/docker-entrypoint-initdb.d/01-apply-migrations.sh:ro
      - ../../db/migrations:/docker-entrypoint-initdb.d/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - octo-internal

networks:
  octo-internal:
    name: octo_internal
    driver: bridge

volumes:
  octo-db-data:
    name: octo-db-data
  octo-file-data:
    name: octo-file-data
