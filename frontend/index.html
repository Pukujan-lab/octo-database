<!doctype html>
<html lang="en" class="dark" data-design="midnight">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Octo — your project's data layer</title>
    <meta
      name="description"
      content="Octo is a self-hosted workspace data platform. Every project gets its own database, file storage, analytics, retrieval, and credentials behind one API. Run one server; stop rebuilding plumbing."
    />
    <link rel="canonical" href="https://octodb.design-bakery.com/" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0B1120" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Octo" />
    <meta property="og:title" content="Octo — your project's data layer" />
    <meta
      property="og:description"
      content="A self-hosted workspace data platform: one API for databases, files, analytics, retrieval, and credentials."
    />
    <meta property="og:url" content="https://octodb.design-bakery.com/" />
    <meta property="og:image" content="https://octodb.design-bakery.com/landing/og-card.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Octo — isometric workspace planes connected to a central hexagonal core." />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Octo — your project's data layer" />
    <meta
      name="twitter:description"
      content="A self-hosted workspace data platform: one API for databases, files, analytics, retrieval, and credentials."
    />
    <meta name="twitter:image" content="https://octodb.design-bakery.com/landing/og-card.jpg" />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Octo",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Linux, macOS",
        "description": "Self-hosted workspace data platform. Every project gets its own database, file storage, analytics, retrieval, and credentials behind one API.",
        "url": "https://octodb.design-bakery.com/",
        "isAccessibleForFree": true,
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the persisted design system + variant before first paint (no flash of default theme).
      (function () {
        try {
          var root = document.documentElement;
          var design = localStorage.getItem('octo_design_system') || 'midnight';
          var variant = localStorage.getItem('octo_theme_variant') || 'dark';
          root.setAttribute('data-design', design);
          root.classList.toggle('dark', variant === 'dark');
        } catch (e) {
          /* storage blocked — keep the markup defaults */
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
